app = "backend-late-smoke-5186"
primary_region = "lax"

[env]
PORT = "8080"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 2    # 2 machines always warm

[[vm]]
  size = "shared-cpu-1x"
  memory = 512                # each machine = 512MB