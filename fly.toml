# fly.toml app configuration file generated for backend-late-smoke-5186 on 2025-10-30T13:36:05-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-late-smoke-5186'
primary_region = 'lax'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Main app process (HTTP server)
[[processes]]
  name = "app"
  cmd = "node server.js"

# Process for daily game outcomes (runs as scheduled task)
[[processes]]
  name = "daily-outcomes"
  cmd = "node scripts/dailyGameOutcomes.js"

[[vm]]
  size = 'shared-cpu-1x'
